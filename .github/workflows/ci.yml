name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd backend
          python run.py &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server is ready after $((i*2)) seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start after 60 seconds"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "Running tests..."
          python tests/test_api.py
          TEST_EXIT=$?
          echo "Tests completed with exit code: $TEST_EXIT"
          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: [frontend-client, frontend-agent, frontend, frontend-ops]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd ${{ matrix.frontend }}
          npm install
      - name: Build
        run: |
          cd ${{ matrix.frontend }}
          npm run build
