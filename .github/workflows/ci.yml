name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create .env file
        run: |
          cd backend
          cat > .env << 'EOF'
          APP_NAME=公司桌面IT服务台
          DEBUG=true
          SECRET_KEY=test-secret-key
          DB_TYPE=sqlite
          JWT_SECRET_KEY=test-jwt-secret-key
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_MINUTES=480
          TRUST_PROXY=false
          DEFAULT_SLA_HOURS=4
          SLA_WARNING_PERCENT=50
          ACCEPT_TIMEOUT_MINUTES=5
          FRONTEND_URL=http://localhost:5173
          EOF
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd backend
          python run.py &
          sleep 15
          python tests/test_api.py
          kill %1 2>/dev/null || true

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: [frontend-client, frontend-agent, frontend, frontend-ops]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd ${{ matrix.frontend }}
          npm install
      - name: Build
        run: |
          cd ${{ matrix.frontend }}
          npm run build
