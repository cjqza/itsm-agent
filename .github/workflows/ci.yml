name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create .env file
        run: |
          cd backend
          printf 'APP_NAME=公司桌面IT服务台\nDEBUG=true\nSECRET_KEY=test-secret-key\nDB_TYPE=sqlite\nJWT_SECRET_KEY=test-jwt-secret-key\nJWT_ALGORITHM=HS256\nJWT_EXPIRE_MINUTES=480\nTRUST_PROXY=false\nDEFAULT_SLA_HOURS=4\nSLA_WARNING_PERCENT=50\nACCEPT_TIMEOUT_MINUTES=5\nFRONTEND_URL=http://localhost:5173\n' > .env
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd backend
          python run.py &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          python tests/test_api.py
          kill %1 2>/dev/null || true

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: [frontend-client, frontend-agent, frontend, frontend-ops]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd ${{ matrix.frontend }}
          npm install
      - name: Build
        run: |
          cd ${{ matrix.frontend }}
          npm run build
